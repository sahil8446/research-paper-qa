[project]
name = "research-paper-qa"
version = "0.1.0"
description = "Agentic RAG assistant for research-paper Q&A, with an evaluation harness"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pymupdf",
    "pydantic>=2",
    "tqdm",
    "sentence-transformers",
    "qdrant-client",
    "anthropic",
    "python-dotenv",
    "streamlit",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
